namespace: cartridge-catalog-back
replicaCount: 1
registry: ghcr.io/juanfranvelilla/cartridge-collection-backend
image:
  tag: ""
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
probes:
  path: /api/health
extraEnv:
  - name: TZ
    value: UTC
  - name: CORS_ORIGINS
    value: "https://coleccion-cartuchos.juanfranciscoperez.es"
extraEnvFrom:
  - secretRef:
      name: coleccion-cartuchos-secrets
resources:
  requests:
    memory: "128Mi"
    cpu: 50m
  limits:
    memory: "256Mi"
    cpu: 500m
ingress:
  enabled: false
gatewayRoute:
  enabled: true
  host: "coleccion-cartuchos.juanfranciscoperez.es"
  path: /api
  extraPaths:
    - /health
gateway:
  enabled: true
  name: lab
  namespace: jenkins
  sectionName: https-coleccion-cartuchos
database:
  host: postgres-service.postgres.svc.cluster.local
