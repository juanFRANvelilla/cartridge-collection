{{- $gateway := default (dict) .Values.gateway -}}
{{- $route := default (dict) .Values.gatewayRoute -}}
{{- if and $route.enabled (default false $gateway.enabled) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "app.fullname" . }}-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway.name }}
      namespace: {{ $gateway.namespace }}
      sectionName: {{ $gateway.sectionName }}
  hostnames:
    - {{ $route.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $route.path | quote }}
      backendRefs:
        - name: {{ include "app.fullname" . }}-service
          port: {{ .Values.service.port }}
{{- end }}
